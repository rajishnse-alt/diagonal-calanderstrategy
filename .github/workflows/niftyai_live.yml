name: NiftyAI live capture + scan

# The two wrappers, running on GitHub — NOT on a local machine, and NOT
# dependent on anyone having the Streamlit app open.
#
# WHY THIS CAN RUN UNATTENDED
#   PCR needs open interest, and the option-chain endpoint requires a token.
#   But OI is column 6 of the PUBLIC historical-candle response:
#     ['2026-08-03T15:35:00+05:30', 14.85, 16.3, 13.5, 14.45, 2651675, 5685290]
#   so PCR = sum(PE OI)/sum(CE OI) needs no login. Verified across all three
#   instruments: NIFTY 0.9048, BANKNIFTY 0.6228, SENSEX 0.6682.
#   That is the whole reason the old PCR log is patchy — it only wrote while
#   someone had the app running (2026-08-03 has 3 rows, 2026-07-22 has 109).

on:
  schedule:
    # MEASURED 2026-08-05: a "*/15" schedule produced ZERO runs on a live
    # market day, while this repo's other workflow fired 2 HOURS late
    # (scheduled 10:15 UTC, ran 12:19 UTC). GitHub drops high-frequency
    # schedules first under load, so 32 slots/day is the least reliable shape
    # possible. Fewer slots, each one self-sufficient, and each run LOOPS
    # internally to cover the gap rather than depending on the next firing.
    - cron: "5 3 * * 1-5"     # ~08:35 IST — session opener, loops the morning
    - cron: "5 7 * * 1-5"     # ~12:35 IST — midday, in case the first was dropped
    - cron: "35 9 * * 1-5"    # ~15:05 IST — close + learning pass
  workflow_dispatch:
    inputs:
      instruments:
        description: "Comma-separated"
        default: "NIFTY,BANKNIFTY,SENSEX"
      force:
        description: "Run even outside market hours"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: niftyai-live
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q requests

      - name: Market-hours gate
        id: gate
        run: |
          # IST = UTC+5:30. Session 09:15-15:30 IST; start capturing at 09:00.
          NOW=$(TZ=Asia/Kolkata date +%H%M)
          DOW=$(TZ=Asia/Kolkata date +%u)
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" -ge 6 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "weekend ($DOW) — skip"
          elif [ "$NOW" -ge 900 ] && [ "$NOW" -le 1535 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "in session ($NOW IST)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "outside hours ($NOW IST) — skip"
          fi

      - name: Capture + scan on a loop until the session ends
        if: steps.gate.outputs.run == 'true'
        # ONE firing covers a stretch of the session instead of trusting 32
        # separate cron slots to land. Capture+scan takes ~52s, so a 15-min
        # cadence is comfortable. Stops at 15:31 IST or when the job budget is
        # nearly spent, whichever comes first, and commits as it goes so a
        # timeout never loses the day's captures.
        run: |
          INSTR="${{ inputs.instruments || 'NIFTY,BANKNIFTY,SENSEX' }}"
          END=$(( $(date +%s) + 5*3600 ))          # under the 6h job ceiling
          while : ; do
            NOW=$(TZ=Asia/Kolkata date +%H%M)
            python niftyai/collector/snapshot.py --instruments "$INSTR" || true
            python niftyai/agent/scan.py --instruments "$INSTR" --write || true
            git add -A niftyai/data_log niftyai/agent/decisions pcr_data || true
            if ! git diff --cached --quiet; then
              git -c user.name=github-actions[bot] \
                  -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                  commit -q -m "NiftyAI capture $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
              for i in 1 2 3 4 5; do
                # Always clear a half-finished rebase before retrying, or every
                # later attempt dies with "unmerged files" and the data is lost.
                git rebase --abort >/dev/null 2>&1 || true
                if git pull -q --rebase origin "${GITHUB_REF_NAME}" && \
                   git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
                  echo "pushed on attempt $i"; break
                fi
                echo "push attempt $i failed"; sleep $((i * 5))
              done
              git rebase --abort >/dev/null 2>&1 || true
            fi
            [ "${{ inputs.force }}" = "true" ] && break
            [ "$NOW" -ge 1531 ] && break
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 900
          done

      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A niftyai/data_log niftyai/agent/decisions pcr_data || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "NiftyAI capture $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          # Runs every 15 min alongside the repo's other bots — rebase, retry.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

  learn:
    # After the close: fold the day's trades into the parameters.
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Daily learning pass
        run: |
          NOW=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$NOW" -ge 1530 ] || [ "${{ inputs.force }}" = "true" ]; then
            # EVERY index, not just NIFTY. params/journal are already keyed per
            # instrument, so each learns from its own trades — BANKNIFTY's
            # monthly-expiry behaviour should not tune NIFTY's weekly stop.
            for I in NIFTY BANKNIFTY SENSEX; do
              echo "--- $I ---"
              python niftyai/agent/learn.py --instrument "$I" || true
            done
          else
            echo "not after close ($NOW IST) — skip"
          fi
      - name: Commit learned parameters
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A niftyai/agent/params_*.json niftyai/agent/learning_log_*.md \
                     niftyai/journal || true
          git diff --cached --quiet && exit 0
          git commit -m "NiftyAI learning $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
