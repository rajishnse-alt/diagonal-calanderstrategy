# ── Viewer-only hardening ────────────────────────────────────────────────────
# The app is for looking at, not for reading the source of.

[client]
# "full" is the DEFAULT and it renders uncaught exceptions in the browser
# WITH THE SOURCE LINES that raised them. This app has thrown NameError in
# front of users before; anyone present saw real code. "none" shows a bare
# "something went wrong" instead. Errors still reach the server logs.
showErrorDetails = "none"

# "auto" exposes the developer menu to viewers - View app source, Rerun,
# Clear cache, Deploy. "minimal" removes those server-side, which CSS cannot
# reliably do: hiding a menu in the DOM does not stop anyone opening it.
toolbarMode = "minimal"

[server]
# Serves ./static/ at /app/static/<file> - the JSON snapshot endpoint.
# Only put files here that are meant to be public: this directory is
# world-readable at a guessable URL whenever the app is.
enableStaticServing = true

[browser]
gatherUsageStats = false
